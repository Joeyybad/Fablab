spring.application.name=fablab-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fablab}
spring.datasource.username=${DB_USER:fablab}
spring.datasource.password=${DB_PASSWORD:fablab}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.version=${INFO_APP_VERSION:@project.version@}
